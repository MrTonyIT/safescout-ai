name: Internal preview checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npx expo export --platform web --output-dir ../scratch/ci-web
        working-directory: mobile
        env:
          EXPO_OFFLINE: '1'
      - run: node scripts/run-browser-checks.cjs
        env:
          WEB_BUILD_DIR: scratch/ci-web
          CHROME_BIN: google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/completion-2026-09-27/*results.json
            docs/completion-2026-09-27/*.png
            docs/research-2026-09-27/*results.json
            docs/research-2026-09-27/*.png
            scratch/browser-checks-*/process-*.log
